<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    
    <!--CSS-->
    <link rel="stylesheet" href="style.css">

    <!--Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="profile.jpg" alt="profile" class="profile-image">
        </div>

        <div class="text-data">
            <span class="name">Sabrina</span>
            <span class="job">Software Engineer</span>
        </div>

        <div class="media-buttons">
            <a href="#" style="background-color: rgb(16, 101, 230);" class="link">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="#" style="background-color: rgb(254, 19, 94);" class="link">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" style="background-color: red;" class="link">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="#" style="background-color: black;" class="link">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a href="#" style="background-color: rgb(38, 154, 199);" class="link">
                <i class="fa-brands fa-telegram"></i>
            </a>
        </div>

        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class="fa-regular fa-heart"></i>
                <span class="number">100k</span>
            </div>
            <div class="data">
                <i class="fa-regular fa-comment"></i>
                <span class="number">50k</span>
            </div>
            <div class="data">
                <i class="fa-solid fa-share"></i>
                <span class="number">60k</span>
            </div>
        </div>
    </div>
</body>
</html>
